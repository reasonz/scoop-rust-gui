[package]
name = "scoopgui"
version = "0.1.0"
edition = "2021"
description = "GUI for Scoop package manager"
authors = ["ScoopGUI Team"]

[dependencies]
egui = "0.22.0"
eframe = "0.22.0"
rfd = "0.11.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
tokio = { version = "1.28", features = ["full"] }
anyhow = "1.0"
log = "0.4"
env_logger = "0.10"
winapi = { version = "0.3", features = ["winuser", "windef", "minwindef", "shellapi", "libloaderapi"] }
